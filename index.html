<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS y DIV</title>
    <style>
        .color_azul {
            color: blue;
        }
        #color_rojo {
            color: red;
        }

        div {
            padding: 20px;
            border: 1px solid black;
            margin: 10px;
        }

        .div-1 {
            background-color: aliceblue;
            text-align: center;
        }

        .div-2 {
            background-color: blue;
            text-align: center;
        }

        .div-3 {
            background-color: cyan;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="div-1">
        <h1 class="color_azul">Hola Mundo / Primer Div</h1>
        <h1 id="color_rojo">Usando ID</h1>
        <p class="color_azul">Reutilizando clase color_azul</p>
    </div>

    <div class="div-2">
        <h1>Segundo Div</h2>
    </div>

    <div class="div-3">
        <h1>Tercer Div</h3>
    </div>
</body>
</html>
